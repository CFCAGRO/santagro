<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro Diário Equipamentos Sonhos</title>
<style>
*{box-sizing:border-box;font-family:Arial, sans-serif;}
body{max-width:720px;margin:10px auto;padding:12px;}
.form-item{margin:14px 0;}
label{display:block;margin-bottom:5px;font-weight:bold;}
input,select,textarea{width:100%;padding:11px;font-size:16px;border:1px solid #ccc;border-radius:7px;}
button{padding:12px 18px;font-size:16px;border:none;border-radius:7px;cursor:pointer;margin:5px 3px;}
#btnSubmit{background:#2b7c2b;color:white;}
.msg{padding:10px;border-radius:6px;margin:10px 0;display:none;}
.success{background:#d9f2d9;color:#155724;}
.error{background:#f8d7da;color:#721c24;}
</style>
</head>
<body>
<h2>📋 Registro Diário de Uso de Equipamento</h2>
<div class="msg success" id="msgSucesso">✅ Registro enviado para planilha Google!</div>
<div class="msg error" id="msgErro">❌ Falha ao salvar, revise os campos.</div>

<div class="form-item">
<label>Data</label>
<input type="date" id="logData">
</div>
<div class="form-item">
<label>Código do Equipamento</label>
<select id="equipCod">
<option value="">Selecione o equipamento</option>
<option value="TR01">TR01 - Caminhão 01</option>
<option value="TR02">TR02 - Caminhão 02</option>
<option value="MA01">MA01 - Trator 01</option>
<option value="MA02">MA02 - Trator 02</option>
</select>
</div>
<div class="form-item">
<label>Tipo de Atividade</label>
<select id="tipoAtividade">
<option value="">Selecione</option>
<option>Operação Agrícola</option>
<option>Entrega para Cliente Externo</option>
<option>Transporte Interno Fazenda</option>
<option>Manutenção / Ocioso</option>
<option>Transporte Administrativo</option>
</select>
</div>
<div class="form-item">
<label>Centro de Custo</label>
<select id="centroCusto">
<option value="">Selecione</option>
<option>Fazenda A (Custo Produção)</option>
<option>Fazenda B (Custo Produção)</option>
<option>Entrega Vendas (Despesa Venda)</option>
<option>Administração (Despesa Admin)</option>
<option>Oficina Manutenção</option>
</select>
</div>
<div class="form-item">
<label>Quantidade de Trabalho (km / h)</label>
<input type="number" id="qtdTrab" step="0.01" min="0">
</div>
<div class="form-item">
<label>Combustível (Litros)</label>
<input type="number" id="combustivel" step="0.01" min="0">
</div>
<div class="form-item">
<label>Descrição da Atividade</label>
<textarea id="desc" rows="2"></textarea>
</div>
<div class="form-item">
<label>Operador / Responsável</label>
<input type="text" id="operador">
</div>
<button id="btnSubmit">Enviar Registro</button>

<script>
// ===== COLE A SUA URL DO WEB APP AQUI =====
const API_URL = "https://script.google.com/macros/s/AKfycbwlEgFgd-hlNGMSbMxjvuwczHATzBwv621eoTqix3VRrz2-KTaAc_UX5KCkGtSBr4xFUw/exec";

document.getElementById('logData').valueAsDate = new Date();
const msgSucesso = document.getElementById("msgSucesso");
const msgErro = document.getElementById("msgErro");

document.getElementById("btnSubmit").onclick = async function(){
  msgSucesso.style.display="none";
  msgErro.style.display="none";

  const dados = {
    data: document.getElementById("logData").value,
    codEquip: document.getElementById("equipCod").value,
    tipoAtividade: document.getElementById("tipoAtividade").value,
    centroCusto: document.getElementById("centroCusto").value,
    qtdTrabalho: Number(document.getElementById("qtdTrab").value),
    combustivel: Number(document.getElementById("combustivel").value||0),
    descricao: document.getElementById("desc").value,
    operador: document.getElementById("operador").value
  }
  //简单校验
  if(!dados.codEquip || !dados.tipoAtividade || !dados.centroCusto || isNaN(dados.qtdTrabalho) || dados.qtdTrabalho < 0){
    msgErro.style.display="block";
    return;
  }

  try{
    const res = await fetch(API_URL,{
      method:"POST",
      body: JSON.stringify(dados)
    });
    const ret = await res.json();
    if(ret.status==="ok"){
      msgSucesso.style.display="block";
      //清空表单
      document.getElementById("qtdTrab").value="";
      document.getElementById("combustivel").value="";
      document.getElementById("desc").value="";
      document.getElementById("operador").value="";
    }
  }catch(e){
    msgErro.style.display="block";
  }
}
</script>
</body>
</html>
