<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a5632">
<title>SANTAGRO FARM Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://cdn.jsdelivr.net/npm/tom-select@2/dist/css/tom-select.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2/dist/js/tom-select.complete.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#1a5632;--green-l:#2d7a4f;--bg:#f5f5f5;--card:#fff;--text:#1a1a1a;--muted:#666;--border:#e0e0e0;--danger:#d32f2f;--blue:#1565c0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
input,select,textarea,button{font-family:inherit;font-size:14px}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:.2s}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:active{background:var(--green-l)}
.btn-outline{background:transparent;border:2px solid var(--green);color:var(--green)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 14px;font-size:13px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--green-l);box-shadow:0 0 0 3px rgba(45,122,79,.15)}
input[readonly]{background:#f0f0f0;color:#555;cursor:not-allowed}
label{display:block;font-weight:600;margin-bottom:4px;color:var(--muted);font-size:13px}
.form-group{margin-bottom:14px}
.card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px}
#loginScreen,#configScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--green),var(--green-l))}
.login-box{background:#fff;border-radius:16px;padding:32px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.login-box h1{text-align:center;color:var(--green);margin-bottom:8px;font-size:22px}
.login-box p{text-align:center;color:var(--muted);margin-bottom:24px;font-size:13px}
#header{background:var(--green);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#header h2{font-size:17px}
#header .user-area{display:flex;align-items:center;gap:8px}
#header .user-name{font-size:13px;opacity:.9}
.logout-btn{background:rgba(255,255,255,.2);color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.dashboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 16px 8px}
.group-header{display:flex;align-items:center;gap:12px;padding:20px 16px 4px;margin-top:8px}
.group-header:first-child{margin-top:0;padding-top:12px}
.group-icon{font-size:26px;line-height:1}
.group-title{font-size:15px;font-weight:700;color:var(--green);letter-spacing:.3px}
.group-desc{font-size:11px;color:var(--muted);margin-top:1px}
.dash-card{background:#fff;border-radius:12px;padding:18px 12px;text-align:center;cursor:pointer;transition:.2s;border:2px solid transparent}
.dash-card:active{transform:scale(.96);border-color:var(--green-l)}
.dash-card .icon{font-size:32px;margin-bottom:8px}
.dash-card .title{font-weight:700;font-size:13px}
.dash-card .desc{font-size:11px;color:var(--muted);margin-top:4px}
.section-header{display:flex;align-items:center;gap:8px;padding:16px 16px 8px;flex-wrap:wrap}
.section-header h3{flex:1;font-size:16px}
.back-btn{background:none;border:none;color:var(--green);font-weight:600;cursor:pointer;font-size:14px;padding:4px 8px}
.list-container{padding:0 16px 16px}
.list-item{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;align-items:center;gap:8px}
.list-item .info{flex:1}
.list-item .info .main{font-weight:600;font-size:14px}
.list-item .info .sub{font-size:12px;color:var(--muted)}
.list-item .actions{display:flex;gap:6px}
.list-item .actions button{background:none;border:none;cursor:pointer;font-size:18px;padding:4px}
.form-container{padding:0 16px 24px}
.form-container .card{padding:20px}
.inv-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.inv-row:last-child{border:none}
.inv-row .label{color:var(--muted)}
.inv-row .value{font-weight:700}
.inv-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}
.inv-ok{background:#e8f5e9;color:#2e7d32}
.inv-low{background:#fff3e0;color:#e65100}
.inv-out{background:#ffebee;color:#c62828}
.inv-warn{background:#fff8e1;color:#f57f17}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;border-radius:8px;z-index:9999;font-size:14px;animation:fadeIn .3s;max-width:90%;text-align:center}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1}}
.empty{text-align:center;padding:40px;color:var(--muted)}
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:50}
.multi-check{display:flex;flex-wrap:wrap;gap:8px}
.multi-check label{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:normal;background:#f5f5f5;padding:6px 10px;border-radius:6px;cursor:pointer}
.multi-check input{width:auto}
.calc-box{padding:12px;border-radius:8px;margin-top:12px;font-weight:600;text-align:center;font-size:13px;line-height:1.5}
.calc-ok{background:#e8f5e9;color:#2e7d32}
.calc-warn{background:#fff3e0;color:#e65100}
.calc-err{background:#ffebee;color:#c62828}
.section-label{font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 10px;padding-bottom:4px;border-bottom:2px solid var(--green)}
.req-star{color:#d32f2f;font-weight:700}
.field-error{border-color:#d32f2f !important;box-shadow:0 0 0 3px rgba(211,47,47,.15) !important}
.report-summary{display:flex;justify-content:space-around;flex-wrap:wrap;gap:12px;text-align:center}
.report-summary .num{font-size:24px;font-weight:700;color:var(--green)}
.report-summary .lbl{font-size:12px;color:var(--muted)}
.planned-inputs-box{background:#f9f9f9;padding:12px;border-radius:8px}
.planned-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;background:#fff;padding:8px;border-radius:6px}
.planned-row > div{display:flex;flex-direction:column}
.planned-row label{font-size:11px;color:var(--muted);margin-bottom:2px}
.planned-row input,.planned-row select{font-size:13px}
.voided{opacity:.5;text-decoration:line-through}
.slider-wrap{display:flex;align-items:center;gap:12px}
.slider-wrap input[type=range]{flex:1;padding:0;height:6px}
.slider-pct{min-width:50px;text-align:right;font-weight:700;color:var(--green)}
.dt-row{display:flex;gap:8px}
.dt-row > div{flex:1}
.form-actions{display:flex;gap:8px;margin-top:8px}
.form-actions .btn{flex:1}
</style>
</head>
<body>

<div id="configScreen" style="display:none">
<div class="login-box">
<h1>🔧 Supabase Setup</h1>
<p>Enter your Supabase project credentials</p>
<div class="form-group"><label>Project URL</label><input id="sbUrl" placeholder="https://xxxx.supabase.co"></div>
<div class="form-group"><label>Anon Key</label><input id="sbKey" placeholder="eyJhbGciOi..." type="password"></div>
<button class="btn btn-primary" style="width:100%" onclick="saveConfig()">Save & Continue</button>
</div>
</div>

<div id="loginScreen" style="display:none">
<div class="login-box">
<h1>🌾 SANTAGRO</h1>
<p>Farm Management System</p>
<div class="form-group"><label>Username</label><input id="loginUser" placeholder="Enter username"></div>
<div class="form-group"><label>Password</label><input id="loginPass" type="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()"></div>
<button class="btn btn-primary" style="width:100%" onclick="doLogin()">Login</button>
<div id="qrSection" style="margin-top:20px;text-align:center;border-top:1px solid #eee;padding-top:16px">
  <p style="font-size:12px;color:#999;margin-bottom:8px">📱 Scan to open on mobile</p>
  <div id="loginQR"></div>
</div>
</div>
</div>

<div id="mainApp" style="display:none">
<div id="header">
<h2 id="headerTitle">🌾 SANTAGRO FARM</h2>
<div class="user-area">
<span class="user-name" id="userName"></span>
<button class="logout-btn" onclick="logout()">Logout</button>
</div>
</div>
<div id="content"></div>
</div>

<script>

// ============================================================
// 日期格式转换
// ============================================================
function isoToDDMMYYYY(iso) {
  if (!iso) return '';
  const s = String(iso).substring(0,10);
  const parts = s.split('-');
  if (parts.length !== 3) return s;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

function ddmmyyyyToISO(ddmmyyyy) {
  if (!ddmmyyyy) return null;
  const parts = String(ddmmyyyy).split('/');
  if (parts.length !== 3) return null;
  const dd = parts[0].padStart(2,'0');
  const mm = parts[1].padStart(2,'0');
  const yyyy = parts[2];
  if (yyyy.length !== 4) return null;
  return `${yyyy}-${mm}-${dd}`;
}

// 通用日期解析：支持 DD/MM/YYYY、YYYY-MM-DD、YYYY/M/D、M/D/YYYY
function parseAnyDate(str) {
  if (!str) return null;
  str = String(str).trim();
  if (!str) return null;

  // YYYY-MM-DD
  let m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;

  // DD/MM/YYYY
  m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) {
    const dd = parseInt(m[1]), mm = parseInt(m[2]), yyyy = m[3];
    // 如果 dd > 12，肯定是 DD/MM
    if (dd > 12) return `${yyyy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    // 如果 mm > 12，肯定是 MM/DD
    if (mm > 12) return `${yyyy}-${String(dd).padStart(2,'0')}-${String(mm).padStart(2,'0')}`;
    // 否则默认 DD/MM
    return `${yyyy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
  }

  // YYYY/M/D
  m = str.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;

  // 最后尝试 JS Date
  const d = new Date(str);
  if (!isNaN(d.getTime())) {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return `${yyyy}-${mm}-${dd}`;
  }
  return null;
}

// 通用布尔解析：支持 true/false/TRUE/FALSE/1/0/yes/no/y/n
function parseAnyBool(str) {
  if (str === null || str === undefined) return null;
  const s = String(str).trim().toLowerCase();
  if (['true','1','yes','y','t'].includes(s)) return 'true';
  if (['false','0','no','n','f',''].includes(s)) return 'false';
  return null;
}

function todayDDMMYYYY() {
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

function nowHHMM() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${hh}:${mm}`;
}

function splitDatetime(iso) {
  if (!iso) return { date: '', time: '' };
  const d = new Date(iso);
  if (isNaN(d.getTime())) return { date: '', time: '' };
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return { date: `${dd}/${mm}/${yyyy}`, time: `${hh}:${mi}` };
}

function mergeDatetime(dateStr, timeStr) {
  if (!dateStr) return null;
  const parts = String(dateStr).split('/');
  if (parts.length !== 3) return null;
  const [dd, mm, yyyy] = parts;
  const [hh, mi] = (timeStr || '00:00').split(':');
  const d = new Date(`${yyyy}-${mm}-${dd}T${hh.padStart(2,'0')}:${(mi||'00').padStart(2,'0')}:00`);
  if (isNaN(d.getTime())) return null;
  return d.toISOString();
}

function init() {
  const url = EMBEDDED_URL || localStorage.getItem('sb_url');
  const key = EMBEDDED_KEY || localStorage.getItem('sb_key');
  if (url && key) {
    sb = supabase.createClient(url, key);
    showLogin();
  } else {
    document.getElementById('configScreen').style.display = 'flex';
  }
}

function saveConfig() {
  const url = document.getElementById('sbUrl').value.trim();
  const key = document.getElementById('sbKey').value.trim();
  if (!url || !key) { toast('Please fill in both fields'); return; }
  localStorage.setItem('sb_url', url);
  localStorage.setItem('sb_key', key);
  sb = supabase.createClient(url, key);
  document.getElementById('configScreen').style.display = 'none';
  showLogin();
}

function showLogin() {
  document.getElementById('configScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';

  const params = new URLSearchParams(window.location.search);
  const preUser = params.get('u');
  document.getElementById('loginUser').value = preUser || '';
  document.getElementById('loginPass').value = '';

  const baseUrl = window.location.href.split('?')[0];
  const qrDiv = document.getElementById('loginQR');
  if (qrDiv) {
    qrDiv.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=2&data=${encodeURIComponent(baseUrl)}" style="width:160px;height:160px;border-radius:8px" alt="QR Code" onerror="this.style.display='none'">`;
  }
}

async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  if (!u || !p) { toast('Enter username and password'); return; }

  const hash = await sha256(p);

  const { data, error } = await sb.from('app_users')
    .select('*')
    .eq('username', u)
    .eq('password_hash', hash)
    .single();

  if (error || !data) { toast('Invalid credentials'); return; }

  currentUser = data;
  localStorage.setItem('session', JSON.stringify({id: data.id, username: data.username, role: data.role, displayName: data.display_name, allowed_tables: data.allowed_tables}));
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('userName').textContent = data.display_name || data.username;
  showDashboard();
}

function logout() {
  localStorage.removeItem('session');
  currentUser = null;
  document.getElementById('mainApp').style.display = 'none';
  showLogin();
}

async function sha256(msg) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function toast(msg, ms=3000) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), ms);
}

function hasAccess(key) {
  if (!currentUser) return false;
  if (currentUser.role === 'admin') return true;
  if (!currentUser.allowed_tables) return false;
  return currentUser.allowed_tables.includes(key);
}

function showDashboard() {
  document.getElementById('headerTitle').textContent = '🌾 SANTAGRO FARM';
  const content = document.getElementById('content');

  let html = '';
  for (const group of GROUPS) {
    const groupTables = Object.entries(TABLES).filter(
      ([k, v]) => v.group === group.key && hasAccess(k)
    );
    if (groupTables.length === 0) continue;

    html += `<div class="group-header">
      <span class="group-icon">${group.icon}</span>
      <div>
        <div class="group-title">${group.label}</div>
        <div class="group-desc">${group.desc}</div>
      </div>
    </div>`;

    html += `<div class="dashboard">`;
    for (const [k, v] of groupTables) {
      html += `<div class="dash-card" onclick="openModule('${k}')">
        <div class="icon">${v.icon}</div>
        <div class="title">${v.label}</div>
        <div class="desc">${v.desc}</div>
      </div>`;
    }
    html += `</div>`;
  }

  content.innerHTML = html;
}

  if (!hasAccess(key)) { toast('No permission to access this module'); showDashboard(); return; }
  currentTable = key;
  const cfg = TABLES[key];
  document.getElementById('headerTitle').textContent = `${cfg.icon} ${cfg.label}`;

// LIST VIEW
// ============================================================
async function showList(key) {
  const cfg = TABLES[key];
  const content = document.getElementById('content');

  for (const f of cfg.fields) {
    if (f.type === 'link' || f.type === 'multilink') {
      await loadLinkCacheForField(f);
    }
    if (f.type === 'lookup') {
      await loadLookupCache(f.lookupCategory);
    }
  }

  let query = sb.from(key).select('*');
  if (cfg.defaultSort) {
    query = query.order(cfg.defaultSort.column, { ascending: cfg.defaultSort.ascending });
    if (cfg.defaultSort.secondaryColumn) {
      query = query.order(cfg.defaultSort.secondaryColumn, { ascending: cfg.defaultSort.secondaryAscending });
    }
  } else {
    query = query.order('created_at', { ascending: false });
  }
  const { data, error } = await query;
  if (error) { toast('Error loading data: ' + error.message); return; }

  let html = `<div class="section-header">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <h3>${cfg.label}</h3>
    <button class="btn btn-outline btn-sm" onclick="downloadCSVTemplate('${key}')">📄 Template</button>
    <button class="btn btn-outline btn-sm" onclick="importCSV('${key}')">📤 Import CSV</button>
    <button class="btn btn-outline btn-sm" onclick="exportCSV('${key}')">📥 Export</button>
    <button class="btn btn-primary btn-sm" onclick="showForm('${key}')">+ Add</button>
  </div>`;

  if (!data || data.length === 0) {
    html += `<div class="empty">No records yet. Tap "+ Add" to create one.</div>`;
  } else {
    html += `<div class="list-container">`;
    for (const row of data) {
      const primaryField = cfg.fields[0];
      let primaryVal = row[primaryField.col];
      if (primaryField.type === 'link') {
        primaryVal = linkCache[`${primaryField.table}_${row[primaryField.col]}`]?.[primaryField.showField] || row[primaryField.col];
      }
      const secondaryField = cfg.fields[1];
      let secondaryVal = '';
      if (secondaryField) {
        const sv = row[secondaryField.col];
        if (sv !== null && sv !== undefined && sv !== '') {
          if (secondaryField.type === 'link') {
            secondaryVal = linkCache[`${secondaryField.table}_${sv}`]?.[secondaryField.showField] || sv;
          } else if (secondaryField.type === 'multilink') {
            secondaryVal = Array.isArray(sv) ? sv.map(id => linkCache[`${secondaryField.table}_${id}`]?.[secondaryField.showField] || id).join(', ') : sv;
          } else if (secondaryField.type === 'multiselect' && Array.isArray(sv)) {
            secondaryVal = sv.join(', ');
          } else if (secondaryField.type === 'datetime') {
            secondaryVal = new Date(sv).toLocaleString();
          } else if (secondaryField.type === 'date') {
            secondaryVal = isoToDDMMYYYY(sv);
          } else {
            secondaryVal = String(sv);
          }
        }
      }
      const voided = row.voided ? ' voided' : '';
      const voidMark = row.voided ? ' <span style="color:#c62828;font-size:11px">[VOID]</span>' : '';
      html += `<div class="list-item${voided}">
        <div class="info">
          <div class="main">${primaryVal || '#' + row.id}${voidMark}</div>
          <div class="sub">${secondaryVal}</div>
        </div>
        <div class="actions">
          ${!row.voided ? `<button onclick="showForm('${key}', ${row.id})" title="Edit">✏️</button>` : ''}
          <button onclick="deleteRecord('${key}', ${row.id})" title="${row.voided ? 'Already voided' : 'Void'}">🗑️</button>
        </div>
      </div>`;
    }
    html += `</div>`;
  }

  content.innerHTML = html;

  const fab = document.createElement('button');
  fab.className = 'fab';
  fab.textContent = '+';
  fab.onclick = () => showForm(key);
  content.appendChild(fab);
}

// ============================================================
async function exportCSV(key) {
  const cfg = TABLES[key];

  for (const f of cfg.fields) {
    if (f.type === 'link' || f.type === 'multilink') {
      await loadLinkCacheForField(f);
    }
  }

  const { data, error } = await sb.from(key).select('*').order('created_at', {ascending: false});
  if (error) { toast('Error: ' + error.message); return; }
  if (!data || data.length === 0) { toast('No data to export'); return; }

  const headers = ['ID', ...cfg.fields.map(f => f.label), 'Created At'];
  const rows = [headers];

  for (const row of data) {
    const values = [row.id];
    for (const f of cfg.fields) {
      let val = row[f.col];
      if (val === null || val === undefined) {
        val = '';
      } else if (f.type === 'link') {
        val = linkCache[`${f.table}_${val}`]?.[f.showField] || val;
      } else if (f.type === 'multilink') {
        val = Array.isArray(val) ? val.map(id => linkCache[`${f.table}_${id}`]?.[f.showField] || id).join('; ') : val;
      } else if (f.type === 'multiselect' && Array.isArray(val)) {
        val = val.join('; ');
      } else if (f.type === 'datetime') {
        val = new Date(val).toLocaleString();
      } else if (f.type === 'date') {
        val = isoToDDMMYYYY(val);
      }
      values.push(String(val));
    }
    values.push(row.created_at ? new Date(row.created_at).toLocaleString() : '');
    rows.push(values);
  }

  const csv = rows.map(r =>
    r.map(cell => {
      const escaped = String(cell).replace(/"/g, '""');
      return `"${escaped}"`;
    }).join(',')
  ).join('\n');

  const blob = new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${key}_export_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(`Exported ${data.length} records`);
}

// ============================================================
// CSV IMPORT
// ============================================================
function importCSV(key) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.csv';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    await processCSVImport(key, text);
  };
  input.click();
}

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { cell += '"'; i++; }
        else inQuotes = false;
      } else cell += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (cell !== '' || row.length > 0) { row.push(cell); rows.push(row); row = []; cell = ''; }
        if (c === '\r' && text[i+1] === '\n') i++;
      } else cell += c;
    }
  }
  if (cell !== '' || row.length > 0) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ''));
}

async function processCSVImport(key, text) {
  const cfg = TABLES[key];
  const rows = parseCSV(text);
  if (rows.length < 2) { toast('CSV must have header and at least one data row'); return; }
  const headers = rows[0].map(h => h.trim().toLowerCase());
  const dataRows = rows.slice(1);

  // 加载关联缓存
  for (const f of cfg.fields) {
    if (f.type === 'link') await loadLinkCache(f.table, f.showField);
    if (f.type === 'lookup') await loadLookupCache(f.lookupCategory);
  }

  const successList = [];
  const failList = [];

  for (let i = 0; i < dataRows.length; i++) {
    const row = dataRows[i];
    try {
      const record = {};
      for (const f of cfg.fields) {
        if (f.previewOnly) continue;
        const idx = headers.findIndex(h => h === f.label.toLowerCase());
        if (idx === -1) continue;
        let val = (row[idx] || '').trim();
        if (val === '' && f.type !== 'date') continue;

        if (f.type === 'number' || f.type === 'range') {
          val = val === '' ? null : parseFloat(val);
          if (val !== null && isNaN(val)) throw new Error(`Invalid number for ${f.label}: "${row[idx]}"`);
        } else if (f.type === 'date') {
          val = val ? parseAnyDate(val) : null;
          if (val === null && row[idx]) throw new Error(`Invalid date for ${f.label}: "${row[idx]}"`);
        } else if (f.type === 'datetime') {
          val = val ? parseAnyDate(val.substring(0,10)) : null;
          if (val === null && row[idx]) throw new Error(`Invalid datetime for ${f.label}: "${row[idx]}"`);
          if (val) val = val + 'T00:00:00Z';
        } else if (f.type === 'link') {
          const items = Object.values(linkCache).filter(v => typeof v === 'object' && v.id && String(v[f.showField]).toLowerCase() === val.toLowerCase());
          if (items.length === 0) throw new Error(`Cannot find ${f.label}: "${val}"`);
          val = items[0].id;
        } else if (f.type === 'select' && f.opts) {
          const found = f.opts.find(o => o.toLowerCase() === val.toLowerCase());
          if (found) val = found;
        } else if (f.type === 'lookup') {
          // 保留原值
        }
        record[f.col] = val;
      }

      // 必填校验
      for (const f of cfg.fields) {
        if (f.previewOnly || !f.required) continue;
        const v = record[f.col];
        if (v === null || v === undefined || v === '') {
          throw new Error(`Missing required field: ${f.label}`);
        }
      }

      successList.push(record);
    } catch (e) {
      failList.push({ row: i + 2, error: e.message });
    }
  }

  if (successList.length > 0) {
    const { error } = await sb.from(key).insert(successList);
    if (error) {
      toast('Batch insert failed: ' + error.message);
      console.error('Insert error:', error);
      return;
    }
  }

  let msg = `Imported ${successList.length}`;
  if (failList.length > 0) {
    msg += `, failed ${failList.length} (rows: ${failList.map(f => f.row).join(',')})`;
    console.warn('Import failures:', failList);
  }
  toast(msg, 5000);
  openModule(key);
}

// ============================================================
// LINK CACHE
// ============================================================
async function loadLinkCache(tableName, showField, extraFields) {
  const cacheKey = tableName + '_' + showField;
  if (linkCache[cacheKey + '_loaded']) return;
  const cols = ['id', showField, ...(extraFields || [])].join(',');
  const { data } = await sb.from(tableName).select(cols);
  if (data) {
    for (const row of data) {
      linkCache[`${tableName}_${row.id}`] = row;
    }
    linkCache[cacheKey + '_loaded'] = true;
  }
}

async function loadLinkCacheForField(f) {
  if (f.table === 'inputs_inventory') {
    await loadLinkCache('inputs_inventory', f.showField, ['unit', 'avg_unit_price', 'current_stock']);
  } else if (f.table === 'equipment') {
    await loadLinkCache('equipment', f.showField, ['tank_capacity']);
  } else {
    await loadLinkCache(f.table, f.showField);
  }
}

// ============================================================
// LOOKUP CACHE
// ============================================================
function normalizeLookupKey(v) {
  return String(v || '')
    .toLowerCase()
    .replace(/[\s\(\)（）]/g, '')
    .replace(/(h|km|kg|l|t)$/i, '');
}

async function loadLookupCache(category) {
  if (!category) return;
  if (lookupCache[category + '_loaded']) return;
  const { data } = await sb.from('lookup_values').select('*').eq('category', category).eq('active', 'true');
  if (data) {
    const seen = new Set();
    const unique = [];
    for (const item of data) {
      if (!item.value) continue;
      const key = normalizeLookupKey(item.value);
      if (seen.has(key)) continue;
      seen.add(key);
      unique.push(item);
    }
    lookupCache[category] = unique;
    lookupCache[category + '_loaded'] = true;
  }
}

function getLookupOptions(category) {
  const items = lookupCache[category] || [];
  return items.map(i => ({value: i.value, label: i.label || i.value}));
}

// ============================================================
// 自动编号
// ============================================================
async function generateNextDocNumber(cfg, tableName) {
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  const datePart = `${yyyy}${mm}${dd}`;
  const prefix = `${cfg.prefix}${datePart}-`;

  const { data } = await sb.from(tableName)
    .select(cfg.field)
    .like(cfg.field, prefix + '%')
    .order(cfg.field, { ascending: false })
    .limit(1);

  let nextSeq = 1;
  if (data && data.length > 0 && data[0][cfg.field]) {
    const parts = String(data[0][cfg.field]).split('-');
    const lastSeq = parseInt(parts[parts.length - 1], 10);
    if (!isNaN(lastSeq)) nextSeq = lastSeq + 1;
  }

  return prefix + String(nextSeq).padStart(cfg.digits, '0');
}

async function previewNewAvgPrice(inputId, intakeQty, unitPrice) {
  const { data: item } = await sb.from('inputs_inventory')
    .select('current_stock, avg_unit_price').eq('id', inputId).single();

  const oldStock = Number(item?.current_stock) || 0;
  const oldAvg = Number(item?.avg_unit_price) || 0;

  const newStock = oldStock + Number(intakeQty);
  const newAvg = newStock > 0
    ? ((oldStock * oldAvg) + (Number(intakeQty) * Number(unitPrice))) / newStock
    : 0;

  const deviation = oldAvg > 0 ? ((newAvg - oldAvg) / oldAvg) * 100 : 0;
  return { oldStock, oldAvg, newStock, newAvg, deviation };
}

// ============================================================
// Maintenance Logs 停机时间自动计算
// ============================================================
function recalcDowntime() {
  const startDate = document.getElementById('fld_maintenance_date')?.value;
  const endDate = document.getElementById('fld_completion_date')?.value;
  const el = document.getElementById('fld_downtime_hours');
  if (!el) return;

  if (!startDate || !endDate) {
    el.value = '';
    return;
  }

  const startISO = ddmmyyyyToISO(startDate);
  const endISO = ddmmyyyyToISO(endDate);
  if (!startISO || !endISO) {
    el.value = '';
    return;
  }

  const startD = new Date(startISO);
  const endD = new Date(endISO);
  const days = (endD - startD) / (1000 * 60 * 60 * 24);

  if (days < 0) {
    el.value = '0';
    return;
  }

  const hours = days === 0 ? 8 : days * 24;
  el.value = hours.toFixed(1);
}

    } else if (f.type === 'multilink') {
      const selected = Array.isArray(val) ? val.map(String) : [];
      const linkItems = Object.entries(linkCache)
        .filter(([k,v]) => k.startsWith(f.table + '_') && typeof v === 'object' && v.id)
        .map(([k,v]) => v);
      fieldsHtml += `<div class="multi-check" id="${id}">`;
      for (const item of linkItems) {
        fieldsHtml += `<label><input type="checkbox" value="${item.id}" ${selected.includes(String(item.id)) ? 'checked' : ''} ${readonlyAttr}> ${escapeHtml(String(item[f.showField]))}</label>`;
      }
      fieldsHtml += `</div>`;
    } else if (f.type === 'link') {
      const linkItems = Object.entries(linkCache)
        .filter(([k,v]) => k.startsWith(f.table + '_') && typeof v === 'object' && v.id)
        .map(([k,v]) => v);
      const isSearchable = SEARCHABLE_LINK_TABLES.includes(f.table) && linkItems.length > 15;
      if (isSearchable && !f.readonly) searchableIds.push(id);
      fieldsHtml += `<select id="${id}" ${onchangeAttr} ${readonlyAttr} ${isSearchable && !f.readonly ? 'data-searchable="1"' : ''}><option value="">Select...</option>`;
      for (const item of linkItems) {
        fieldsHtml += `<option value="${item.id}" ${val === item.id ? 'selected' : ''}>${escapeHtml(String(item[f.showField]))}</option>`;
      }
      fieldsHtml += `</select>`;
    } else if (f.type === 'linkedreadonly') {
      fieldsHtml += `<input id="${id}" value="" readonly placeholder="Auto from linked item">`;
    }
    fieldsHtml += `</div>`;
  }

  let plannedInputsHtml = '';
  if (cfg.hasPlannedInputs) {
    plannedInputsHtml = `
      <div class="section-label">Planned Inputs</div>
      <div class="planned-inputs-box" id="plannedInputsBox">
        <div id="plannedInputsRows"></div>
        <button type="button" class="btn btn-outline btn-sm" style="width:100%;margin-top:8px" onclick="addPlannedInputRow()">+ Add Planned Input</button>
      </div>
    `;
  }

  content.innerHTML = `<div class="section-header">
    <button class="back-btn" onclick="openModule('${key}')">← Back</button>
    <h3>${isEdit ? 'Edit' : 'Add'} ${cfg.label}</h3>
  </div>
  <div class="form-container">
    <div class="card">
      ${fieldsHtml}
      ${plannedInputsHtml}
      <div class="form-actions">
        <button class="btn btn-primary" onclick="saveRecord('${key}', ${isEdit ? editId : 'null'})">
          ${isEdit ? 'Update' : 'Save'} Record
        </button>
        <button class="btn btn-outline" onclick="clearForm('${key}')">Clear Form</button>
      </div>
    </div>
  </div>`;

  searchableIds.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      try {
        const ts = new TomSelect(el, {
          placeholder: 'Type to search...',
          allowEmptyOption: true,
          maxOptions: 500,
          sortField: { field: 'text', direction: 'asc' }
        });
        tomSelectInstances.push(ts);
      } catch(e) { console.warn('TomSelect init failed for', id, e); }
    }
  });

  if (cfg.autoNumber && !isEdit) {
    const nextNum = await generateNextDocNumber(cfg.autoNumber, key);
    const el = document.getElementById('fld_' + cfg.autoNumber.field);
    if (el) el.value = nextNum;
  }

  if (cfg.hasPlannedInputs && isEdit) {
    const { data: planned } = await sb.from('inputs_per_work_order')
      .select('*').eq('work_order_id', editId);
    for (const p of (planned || [])) {
      await addPlannedInputRow(p);
    }
  }

  if (key === 'fuel_output' && isEdit) recalcFuelOutput();
  if (key === 'work_order_execution') {
    recalcWorkOrderExecution();
    if (isEdit) await autoFillFromWorkOrder();
    ['fuel_before_pct', 'fuel_after_pct'].forEach(col => {
      const el = document.getElementById('fld_' + col);
      const pctEl = document.getElementById('fld_' + col + '_pct');
      if (el && pctEl) pctEl.textContent = (el.value || 0) + '%';
    });
  }
  if (key === 'inputs_intake') {
    const sel = document.getElementById('fld_input_id');
    if (sel && sel.value) await autoFillIntakePreview();
  }
  if (key === 'inputs_output') {
    const sel = document.getElementById('fld_input_id');
    if (sel && sel.value) await autoFillInputUnit();
  }
  if (key === 'fuel_intake') await autoFillFuelIntakePreview();
  if (key === 'fuel_output') await autoFillFuelOutputPrice();
  if (key === 'maintenance_logs') recalcDowntime();
}

// ============================================================
// CLEAR FORM
// ============================================================
async function clearForm(key) {
  const ok = confirm('Clear this form? All unsaved changes will be lost.');
  if (!ok) return;

  const cfg = TABLES[key];
  const today = todayDDMMYYYY();
  const now = nowHHMM();

  for (const f of cfg.fields) {
    if (f.previewOnly) continue;
    const el = document.getElementById('fld_' + f.col);
    if (!el) continue;

    if (f.type === 'multilink' || f.type === 'multiselect') {
      el.querySelectorAll('input:checked').forEach(c => { c.checked = false; });
    } else if (f.type === 'range') {
      el.value = 0;
      const pctEl = document.getElementById('fld_' + f.col + '_pct');
      if (pctEl) pctEl.textContent = '0%';
    } else if (f.type === 'datetime') {
      const dateEl = document.getElementById('fld_' + f.col + '__date');
      const timeEl = document.getElementById('fld_' + f.col + '__time');
      if (dateEl) dateEl.value = today;
      if (timeEl) timeEl.value = now;
    } else if (f.type === 'date') {
      el.value = today;
    } else if (f.type === 'link' || f.type === 'lookup') {
      if (el.tomselect) {
        el.tomselect.clear();
      } else {
        el.value = '';
      }
    } else if (f.type === 'linkedreadonly') {
      el.value = '';
    } else {
      el.value = '';
    }
  }

  if (cfg.autoNumber) {
    const numEl = document.getElementById('fld_' + cfg.autoNumber.field);
    if (numEl) {
      const nextNum = await generateNextDocNumber(cfg.autoNumber, key);
      numEl.value = nextNum;
    }
  }

  if (key === 'fuel_intake') await autoFillFuelIntakePreview();
  if (key === 'fuel_output') await autoFillFuelOutputPrice();
  if (key === 'inputs_intake') await autoFillIntakePreview();
  if (key === 'inputs_output') await autoFillInputUnit();
  if (key === 'work_order_execution') recalcWorkOrderExecution();
  if (key === 'maintenance_logs') recalcDowntime();

  toast('Form cleared');
}

// ============================================================
// 计划投入品
// ============================================================
async function addPlannedInputRow(data) {
  const rows = document.getElementById('plannedInputsRows');
  if (!rows) return;

  await loadLinkCache('inputs_inventory', 'input_name', ['unit', 'avg_unit_price', 'current_stock']);
  const inputItems = Object.entries(linkCache)
    .filter(([k,v]) => k.startsWith('inputs_inventory_') && typeof v === 'object' && v.id)
    .map(([k,v]) => v);

  const rowId = 'plannedRow_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  const div = document.createElement('div');
  div.className = 'planned-row';
  div.id = rowId;

  let optsHtml = '<option value="">Select input...</option>';
  for (const item of inputItems) {
    const sel = data && data.input_id === item.id ? 'selected' : '';
    optsHtml += `<option value="${item.id}" data-unit="${escapeHtml(item.unit || '')}" ${sel}>${escapeHtml(item.input_name)}</option>`;
  }

  let initialUnit = '';
  if (data && data.input_id) {
    const item = linkCache[`inputs_inventory_${data.input_id}`];
    if (item && item.unit) {
      const found = getLookupOptions('unit').find(o => o.value === item.unit);
      initialUnit = found ? found.label : item.unit;
    }
  }

  div.innerHTML = `
    <div style="flex:2">
      <label>Input Item</label>
      <select class="planned-input-select" onchange="onPlannedInputChange('${rowId}')">${optsHtml}</select>
    </div>
    <div style="flex:0 0 90px">
      <label>Unit</label>
      <input type="text" class="planned-unit" value="${escapeHtml(initialUnit)}" readonly placeholder="—">
    </div>
    <div style="flex:1">
      <label>Qty</label>
      <input type="number" step="any" class="planned-qty" value="${data ? (data.quantity_used ?? '') : ''}" placeholder="0">
    </div>
    <div style="flex:0 0 auto;padding-bottom:4px">
      <button type="button" class="btn btn-danger btn-sm" onclick="document.getElementById('${rowId}').remove()">✕</button>
    </div>
  `;
  rows.appendChild(div);
}

function onPlannedInputChange(rowId) {
  const row = document.getElementById(rowId);
  if (!row) return;
  const sel = row.querySelector('.planned-input-select');
  const unitEl = row.querySelector('.planned-unit');
  const opt = sel.options[sel.selectedIndex];
  const unitVal = opt?.getAttribute('data-unit') || '';
  let unitLabel = unitVal;
  if (unitVal) {
    const found = getLookupOptions('unit').find(o => o.value === unitVal);
    if (found) unitLabel = found.label;
  }
  unitEl.value = unitLabel;
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ============================================================
// SAVE / DELETE
// ============================================================
async function saveRecord(key, editId) {
  const cfg = TABLES[key];
  const record = {};

  for (const f of cfg.fields) {
    if (!f.required) continue;
    let el = document.getElementById('fld_' + f.col);
    if (f.type === 'datetime') el = document.getElementById('fld_' + f.col + '__date');
    if (!el) continue;
    let empty = false;
    if (f.type === 'multilink' || f.type === 'multiselect') {
      empty = el.querySelectorAll('input:checked').length === 0;
    } else if (f.type === 'linkedreadonly') {
      continue;
    } else {
      empty = !el.value;
    }
    if (empty) {
      el.classList.add('field-error');
      toast(`"${f.label}" is required`);
      el.scrollIntoView({behavior:'smooth', block:'center'});
      return;
    } else {
      el.classList.remove('field-error');
    }
  }

  for (const f of cfg.fields) {
    if (f.previewOnly) continue;

    if (f.type === 'datetime') {
      const dateEl = document.getElementById('fld_' + f.col + '__date');
      const timeEl = document.getElementById('fld_' + f.col + '__time');
      const dateStr = dateEl?.value || '';
      const timeStr = timeEl?.value || '00:00';
      record[f.col] = dateStr ? mergeDatetime(dateStr, timeStr) : null;
      continue;
    }

    const el = document.getElementById('fld_' + f.col);
    if (!el) continue;
    let val = el.value;

    if (f.type === 'number' || f.type === 'range') {
      val = val === '' ? null : parseFloat(val);
    } else if (f.type === 'multiselect') {
      const checks = el.querySelectorAll('input:checked');
      val = Array.from(checks).map(c => c.value);
    } else if (f.type === 'multilink') {
      const checks = el.querySelectorAll('input:checked');
      val = Array.from(checks).map(c => parseInt(c.value));
    } else if (f.type === 'link') {
      val = val === '' ? null : parseInt(val);
    } else if (f.type === 'date') {
      val = val ? ddmmyyyyToISO(val) : null;
      if (val && isNaN(new Date(val).getTime())) {
        toast(`"${f.label}" invalid date format. Use DD/MM/YYYY.`);
        return;
      }
    } else if (f.type === 'linkedreadonly') {
      continue;
    } else if (val === '') {
      val = null;
    }

    record[f.col] = val;
  }

  if (key === 'maintenance_logs' && record.status === 'Completed' && !record.completion_date) {
    const el = document.getElementById('fld_completion_date');
    if (el) {
      el.classList.add('field-error');
      el.scrollIntoView({behavior:'smooth', block:'center'});
    }
    toast('"Completion Date" is required when Status is Completed');
    return;
  }

  if (cfg.autoNumber && !editId) {
    record[cfg.autoNumber.field] = await generateNextDocNumber(cfg.autoNumber, key);
  }

  if (key === 'inputs_inventory' && !editId) {
    if (record.opening_unit_price != null) record.avg_unit_price = Number(record.opening_unit_price);
    if (record.opening_stock != null) record.current_stock = Number(record.opening_stock);
  }

  if (key === 'inputs_intake' && record.intake_quantity != null && record.unit_price != null) {
    record.total_value = Number((Number(record.intake_quantity) * Number(record.unit_price)).toFixed(2));
  }

  if (key === 'fuel_intake' && record.intake_quantity != null && record.unit_price != null) {
    record.total_value = Number((Number(record.intake_quantity) * Number(record.unit_price)).toFixed(2));
  }

  if (key === 'maintenance_logs' && record.maintenance_date && record.completion_date) {
    const startD = new Date(record.maintenance_date);
    const endD = new Date(record.completion_date);
    const days = (endD - startD) / (1000 * 60 * 60 * 24);
    if (days < 0) {
      toast('"Completion Date" cannot be before "Maintenance Date"');
      return;
    }
    record.downtime_hours = days === 0 ? 8 : days * 24;
  }

  record.created_by = currentUser.id;

  if (key === 'inputs_intake' && !editId && record.input_id && record.intake_quantity && record.unit_price != null) {
    const preview = await previewNewAvgPrice(record.input_id, record.intake_quantity, record.unit_price);
    if (Math.abs(preview.deviation) > PRICE_DEVIATION_THRESHOLD) {
      const approval = await askAdminApproval(preview.deviation, preview.oldAvg, preview.newAvg);
      if (!approval.approved) { toast('Approval cancelled, record not saved'); return; }
      record.price_deviation_pct = Number(preview.deviation.toFixed(2));
      record.approved_by = approval.adminId;
      record.approved_at = new Date().toISOString();
      record.approval_note = approval.note || null;
    } else {
      record.price_deviation_pct = Number(preview.deviation.toFixed(2));
    }
  }

  if (key === 'fuel_intake' && !editId && record.fuel_type && record.tank_location && record.intake_quantity && record.unit_price != null) {
    const preview = await previewFuelNewAvg(record.fuel_type, record.tank_location, record.intake_quantity, record.unit_price);
    if (Math.abs(preview.deviation) > PRICE_DEVIATION_THRESHOLD) {
      const approval = await askAdminApproval(preview.deviation, preview.oldAvg, preview.newAvg);
      if (!approval.approved) { toast('Approval cancelled, record not saved'); return; }
      record.price_deviation_pct = Number(preview.deviation.toFixed(2));
      record.approved_by = approval.adminId;
      record.approved_at = new Date().toISOString();
      record.approval_note = approval.note || null;
    } else {
      record.price_deviation_pct = Number(preview.deviation.toFixed(2));
    }
  }

  if (key === 'inputs_output' && !editId && record.input_id) {
    const { data: item } = await sb.from('inputs_inventory')
      .select('avg_unit_price, current_stock, input_name').eq('id', record.input_id).single();
    const avg = Number(item?.avg_unit_price) || 0;
    const stock = Number(item?.current_stock) || 0;
    const qty = Number(record.actual_output_quantity) || 0;
    if (qty > stock) {
      const proceed = await askStockShortage(stock, qty, item?.input_name || ('#' + record.input_id));
      if (!proceed) { toast('Dispatch cancelled'); return; }
    }
    record.system_unit_price = avg;
    record.unit_price = avg;
    record.total_value = Number((qty * avg).toFixed(2));
  }

  if (key === 'fuel_output' && !editId && record.fuel_type && record.tank_location) {
    const avg = await getFuelAvgPrice(record.fuel_type, record.tank_location);
    record.system_unit_price = avg;
    record.unit_price = avg;
    const liters = Number(record.liters_added) || 0;
    record.total_value = Number((liters * avg).toFixed(2));
    record.liters_refueled = liters;
  }

  if (key === 'work_order_execution' && record.fuel_equipment_id) {
    const { data: eq } = await sb.from('equipment')
      .select('tank_capacity').eq('id', record.fuel_equipment_id).single();
    const tankCap = Number(eq?.tank_capacity) || 0;
    const beforePct = Number(record.fuel_before_pct) || 0;
    const afterPct = Number(record.fuel_after_pct) || 0;
    const beforeL = tankCap * beforePct / 100;
    const afterL = tankCap * afterPct / 100;
    const refuel = Number(record.refueling_l) || 0;
    const fuelConsumed = Math.max(0, beforeL + refuel - afterL);
    const initH = Number(record.initial_hour_meter) || 0;
    const finalH = Number(record.final_hour_meter) || 0;
    const hours = finalH - initH;
    const fuelPerHour = hours > 0 ? (fuelConsumed / hours) : 0;

    record.fuel_before_work = Number(beforeL.toFixed(2));
    record.fuel_after_work = Number(afterL.toFixed(2));
    record.fuel_consumed = Number(fuelConsumed.toFixed(2));
    record.fuel_per_hour = Number(fuelPerHour.toFixed(2));
  }

  let plannedList = [];
  if (cfg.hasPlannedInputs) {
    const rows = document.querySelectorAll('#plannedInputsRows .planned-row');
    rows.forEach(r => {
      const inputId = r.querySelector('.planned-input-select')?.value;
      const qty = r.querySelector('.planned-qty')?.value;
      const unitVal = r.querySelector('.planned-unit')?.value;
      if (inputId && qty) {
        plannedList.push({
          input_id: parseInt(inputId),
          quantity_used: parseFloat(qty),
          unit: unitVal || null
        });
      }
    });
  }

  if (editId) {
    const { error } = await sb.from(key).update(record).eq('id', editId);
    if (error) { toast('Error: ' + error.message); return; }
    if (cfg.hasPlannedInputs) {
      await sb.from('inputs_per_work_order').delete().eq('work_order_id', editId);
      for (const p of plannedList) {
        await sb.from('inputs_per_work_order').insert({ ...p, work_order_id: editId });
      }
    }
    toast('Record updated');
  } else {
    let inserted = null;
    let error = null;
    for (let attempt = 0; attempt < 2; attempt++) {
      if (attempt > 0 && cfg.autoNumber) {
        record[cfg.autoNumber.field] = await generateNextDocNumber(cfg.autoNumber, key);
      }
      const res = await sb.from(key).insert(record).select().single();
      inserted = res.data;
      error = res.error;
      if (!error) break;
      if (!/duplicate key|unique/i.test(error.message)) break;
    }
    if (error) { toast('Error: ' + error.message); return; }

    try {
      if (key === 'inputs_intake') {
        await applyIntakeToInventory(record.input_id, record.intake_quantity, record.unit_price);
      } else if (key === 'inputs_output') {
        await applyOutputToInventory(record.input_id, record.actual_output_quantity);
      } else if (key === 'inventory_movements') {
        await applyMovementToInventory(record.input_id, record.quantity);
      } else if (key === 'fuel_intake') {
        await applyFuelIntakeToInventory(record.fuel_type, record.tank_location, record.intake_quantity, record.unit_price);
      } else if (key === 'fuel_output') {
        await applyFuelOutputToInventory(record.fuel_type, record.tank_location, record.liters_added);
      }
    } catch (e) {
      console.error('Inventory update failed:', e);
      toast('Warning: inventory update failed - ' + e.message);
    }

    if (cfg.hasPlannedInputs && inserted) {
      for (const p of plannedList) {
        await sb.from('inputs_per_work_order').insert({ ...p, work_order_id: inserted.id });
      }
    }
    toast('Record saved');
  }
  openModule(key);
}

async function deleteRecord(key, id) {
  if (currentUser.role !== 'admin') {
    toast('Only admin can void records');
    return;
  }

  const ok = await askDeleteConfirm(key);
  if (!ok) return;

  const { error } = await sb.from(key).update({ voided: true }).eq('id', id);
  if (error) {
    if (/column .*voided.* does not exist/i.test(error.message)) {
      const { error: err2 } = await sb.from(key).delete().eq('id', id);
      if (err2) { toast('Error: ' + err2.message); return; }
      toast('Record deleted');
    } else {
      toast('Error: ' + error.message);
      return;
    }
  } else {
    toast('Record voided');
  }
  openModule(key);
}

function askDeleteConfirm(key) {
  return new Promise((resolve) => {
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:99999;padding:20px';
    modal.innerHTML = `
      <div style="background:#fff;border-radius:16px;padding:24px;max-width:400px;width:100%">
        <h3 style="color:#d32f2f;margin-bottom:8px">🗑️ Void Record</h3>
        <p style="color:#666;font-size:13px;margin-bottom:16px">
          This will mark the record as voided. Stock and weighted avg price will NOT be reverted.<br>
          Admin only.
        </p>
        <div style="display:flex;gap:8px">
          <button class="btn btn-outline" style="flex:1" id="del_cancel">Cancel</button>
          <button class="btn btn-danger" style="flex:1" id="del_ok">Void</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    modal.querySelector('#del_cancel').onclick = () => { modal.remove(); resolve(false); };
    modal.querySelector('#del_ok').onclick = () => { modal.remove(); resolve(true); };
  });
}

    .select('planned_service_type, field_id')
    .eq('id', woId)

  const serviceEl = document.getElementById('fld_service_type_actual');

  const fieldEl = document.getElementById('fld_field_id');

}

// ============================================================

// ============================================================
function onFuelPctChange(col) {
  const el = document.getElementById('fld_' + col);
  const pctEl = document.getElementById('fld_' + col + '_pct');
  if (pctEl) pctEl.textContent = (el?.value || 0) + '%';
  recalcWorkOrderExecution();
}

async function onFuelEquipmentChange() {
  const eqEl = document.getElementById('fld_fuel_equipment_id');
  const eqId = eqEl?.value;
  const capEl = document.getElementById('fld_tank_capacity_display');

  if (!eqId) {
    if (capEl) capEl.value = '';
    return;
  }

  const { data: eq } = await sb.from('equipment')
    .select('tank_capacity').eq('id', eqId).single();
  const cap = Number(eq?.tank_capacity) || 0;
  if (capEl) capEl.value = cap.toFixed(2);
  recalcWorkOrderExecution();
  await autoFillRefuelingFromFuelOutput();
}

function recalcWorkOrderExecution() {
  const cap = parseFloat(document.getElementById('fld_tank_capacity_display')?.value) || 0;
  const beforePct = parseFloat(document.getElementById('fld_fuel_before_pct')?.value) || 0;
  const afterPct = parseFloat(document.getElementById('fld_fuel_after_pct')?.value) || 0;
  const refuel = parseFloat(document.getElementById('fld_refueling_l')?.value) || 0;
  const initH = parseFloat(document.getElementById('fld_initial_hour_meter')?.value) || 0;
  const finalH = parseFloat(document.getElementById('fld_final_hour_meter')?.value) || 0;

  const beforeL = cap * beforePct / 100;
  const afterL = cap * afterPct / 100;
  const fuelConsumed = Math.max(0, beforeL + refuel - afterL);
  const hours = finalH - initH;
  const fuelPerHour = hours > 0 ? (fuelConsumed / hours) : 0;

  const setVal = (id, v) => { const el = document.getElementById(id); if (el) el.value = v.toFixed(2); };
  setVal('fld_fuel_before_work', beforeL);
  setVal('fld_fuel_after_work', afterL);
  setVal('fld_fuel_consumed', fuelConsumed);
  setVal('fld_fuel_per_hour', fuelPerHour);

  const bpEl = document.getElementById('fld_fuel_before_pct_pct');
  const apEl = document.getElementById('fld_fuel_after_pct_pct');
  if (bpEl) bpEl.textContent = beforePct + '%';
  if (apEl) apEl.textContent = afterPct + '%';
}

async function autoFillRefuelingFromFuelOutput() {
  const eqId = document.getElementById('fld_fuel_equipment_id')?.value;
  const startDate = document.getElementById('fld_start_time__date')?.value;
  const startTime = document.getElementById('fld_start_time__time')?.value || '00:00';
  const endDate = document.getElementById('fld_end_time__date')?.value;
  const endTime = document.getElementById('fld_end_time__time')?.value || '23:59';
  const refuelEl = document.getElementById('fld_refueling_l');

  if (!eqId) { toast('Please select Fuel Equipment first'); return; }
  if (!startDate || !endDate) { toast('Please fill Start Time and End Time first'); return; }
  if (!refuelEl) return;

  const startISO = mergeDatetime(startDate, startTime);
  const endISO = mergeDatetime(endDate, endTime);
  if (!startISO || !endISO) { toast('Invalid date format. Use DD/MM/YYYY.'); return; }

  const { data: fuelRecords, error } = await sb.from('fuel_output')
    .select('liters_added, date_time')
    .eq('equipment_id', eqId)
    .gte('date_time', startISO)
    .lte('date_time', endISO)
    .or('voided.is.null,voided.eq.false');

  if (error) { toast('Query failed: ' + error.message); return; }

  const total = (fuelRecords || []).reduce((s, r) => s + (Number(r.liters_added) || 0), 0);
  refuelEl.value = total > 0 ? total.toFixed(2) : '0';
  recalcWorkOrderExecution();
  toast(`Synced ${(fuelRecords || []).length} fuel records, total ${total.toFixed(2)} L`);
}

function recalcFuelOutput() {
  const litersAdded = parseFloat(document.getElementById('fld_liters_added')?.value) || 0;
  const prevReading = parseFloat(document.getElementById('fld_previous_reading')?.value) || 0;
  const currReading = parseFloat(document.getElementById('fld_current_reading')?.value) || 0;

  const deltaReading = currReading - prevReading;
  const consumptionRate = deltaReading > 0 ? (litersAdded / deltaReading) : 0;

  const setVal = (id, v) => { const el = document.getElementById(id); if (el) el.value = v.toFixed(2); };
  setVal('fld_fuel_used', litersAdded);
  setVal('fld_consumption_rate', consumptionRate);

  const sysPrice = parseFloat(document.getElementById('fld_system_unit_price')?.value) || 0;
  const totalEl = document.getElementById('fld_total_value');
  if (totalEl) totalEl.value = (litersAdded * sysPrice).toFixed(2);
}

async function filterOutputInputs() {
  const inputSel = document.getElementById('fld_input_id');
  if (!inputSel) return;
  const woId = document.getElementById('fld_work_order_id')?.value;

  inputSel.innerHTML = '<option value="">Select...</option>';
  if (!woId) return;

  const { data: planned } = await sb.from('inputs_per_work_order')
    .select('input_id, quantity_used, unit')
    .eq('work_order_id', woId);

  if (!planned || planned.length === 0) {
    const inputItems = Object.entries(linkCache)
      .filter(([k,v]) => k.startsWith('inputs_inventory_') && typeof v === 'object' && v.id)
      .map(([k,v]) => v);
    for (const item of inputItems) {
      inputSel.innerHTML += `<option value="${item.id}" data-unit="${escapeHtml(item.unit || '')}">${escapeHtml(item.input_name)}</option>`;
    }
    return;
  }

  const seen = new Set();
  for (const p of planned) {
    if (seen.has(p.input_id)) continue;
    seen.add(p.input_id);
    const item = linkCache[`inputs_inventory_${p.input_id}`];
    const name = item ? item.input_name : '#' + p.input_id;
    const unit = item ? (item.unit || '') : '';
    inputSel.innerHTML += `<option value="${p.input_id}" data-unit="${escapeHtml(unit)}">${escapeHtml(name)}</option>`;
  }
}

  const username = document.getElementById('usr_username').value.trim();

  const role = document.getElementById('usr_role').value;

    if (allowedTables.length === 0) { toast('Select at least one table for staff users'); return; }
  } else {
    allowedTables = Object.keys(TABLES).filter(k => !TABLES[k].isAdmin);
  }

  const record = { username, display_name: displayName, role, allowed_tables: allowedTables };

  if (password) {
    record.password_hash = await sha256(password);
  } else if (!editId) {
    toast('Password required for new user'); return;
  }

  if (editId) {
    const { error } = await sb.from('app_users').update(record).eq('id', editId);
    if (error) { toast('Error: ' + error.message); return; }
    toast('User updated');
  } else {
    const { error } = await sb.from('app_users').insert(record);
    if (error) { toast('Error: ' + error.message); return; }
    toast('User created');
  }
  showUserManagement();
}

async function deleteUser(id) {
  if (!confirm('Delete this user?')) return;
  const { error } = await sb.from('app_users').delete().eq('id', id);
  if (error) { toast('Error: ' + error.message); return; }
  toast('User deleted');
  showUserManagement();
}

// ============================================================
// INIT
// ============================================================
const savedSession = localStorage.getItem('session');
if (savedSession) {
  const url = EMBEDDED_URL || localStorage.getItem('sb_url');
  const key = EMBEDDED_KEY || localStorage.getItem('sb_key');
  if (url && key) {
    sb = supabase.createClient(url, key);
    currentUser = JSON.parse(savedSession);
  }
}

init();

if (currentUser) {
  document.getElementById('loginScreen') && (document.getElementById('loginScreen').style.display = 'none');
  document.getElementById('configScreen') && (document.getElementById('configScreen').style.display = 'none');
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('userName').textContent = currentUser.displayName || currentUser.username;
  showDashboard();
}
</script>
