<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a5632">
<title>SANTAGRO FARM Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://cdn.jsdelivr.net/npm/tom-select@2/dist/css/tom-select.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2/dist/js/tom-select.complete.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#1a5632;--green-l:#2d7a4f;--bg:#f5f5f5;--card:#fff;--text:#1a1a1a;--muted:#666;--border:#e0e0e0;--danger:#d32f2f;--blue:#1565c0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
input,select,textarea,button{font-family:inherit;font-size:14px}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:.2s}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:active{background:var(--green-l)}
.btn-outline{background:transparent;border:2px solid var(--green);color:var(--green)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 14px;font-size:13px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--green-l);box-shadow:0 0 0 3px rgba(45,122,79,.15)}
input[readonly]{background:#f0f0f0;color:#555;cursor:not-allowed}
label{display:block;font-weight:600;margin-bottom:4px;color:var(--muted);font-size:13px}
.form-group{margin-bottom:14px}
.card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px}
#loginScreen,#configScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--green),var(--green-l))}
.login-box{background:#fff;border-radius:16px;padding:32px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.login-box h1{text-align:center;color:var(--green);margin-bottom:8px;font-size:22px}
.login-box p{text-align:center;color:var(--muted);margin-bottom:24px;font-size:13px}
#header{background:var(--green);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#header h2{font-size:17px}
#header .user-area{display:flex;align-items:center;gap:8px}
#header .user-name{font-size:13px;opacity:.9}
.logout-btn{background:rgba(255,255,255,.2);color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.dashboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 16px 8px}
.group-header{display:flex;align-items:center;gap:12px;padding:20px 16px 4px;margin-top:8px}
.group-header:first-child{margin-top:0;padding-top:12px}
.group-icon{font-size:26px;line-height:1}
.group-title{font-size:15px;font-weight:700;color:var(--green);letter-spacing:.3px}
.group-desc{font-size:11px;color:var(--muted);margin-top:1px}
.dash-card{background:#fff;border-radius:12px;padding:18px 12px;text-align:center;cursor:pointer;transition:.2s;border:2px solid transparent}
.dash-card:active{transform:scale(.96);border-color:var(--green-l)}
.dash-card .icon{font-size:32px;margin-bottom:8px}
.dash-card .title{font-weight:700;font-size:13px}
.dash-card .desc{font-size:11px;color:var(--muted);margin-top:4px}
.section-header{display:flex;align-items:center;gap:8px;padding:16px 16px 8px;flex-wrap:wrap}
.section-header h3{flex:1;font-size:16px}
.back-btn{background:none;border:none;color:var(--green);font-weight:600;cursor:pointer;font-size:14px;padding:4px 8px}
.list-container{padding:0 16px 16px}
.list-item{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;align-items:center;gap:8px}
.list-item .info{flex:1}
.list-item .info .main{font-weight:600;font-size:14px}
.list-item .info .sub{font-size:12px;color:var(--muted)}
.list-item .actions{display:flex;gap:6px}
.list-item .actions button{background:none;border:none;cursor:pointer;font-size:18px;padding:4px}
.form-container{padding:0 16px 24px}
.form-container .card{padding:20px}
.inv-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.inv-row:last-child{border:none}
.inv-row .label{color:var(--muted)}
.inv-row .value{font-weight:700}
.inv-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}
.inv-ok{background:#e8f5e9;color:#2e7d32}
.inv-low{background:#fff3e0;color:#e65100}
.inv-out{background:#ffebee;color:#c62828}
.inv-warn{background:#fff8e1;color:#f57f17}
.abc-a{background:#ffebee;color:#c62828}
.abc-b{background:#fff3e0;color:#e65100}
.abc-c{background:#e8f5e9;color:#2e7d32}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;border-radius:8px;z-index:9999;font-size:14px;animation:fadeIn .3s;max-width:90%;text-align:center}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1}}
.empty{text-align:center;padding:40px;color:var(--muted)}
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:50}
.multi-check{display:flex;flex-wrap:wrap;gap:8px}
.multi-check label{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:normal;background:#f5f5f5;padding:6px 10px;border-radius:6px;cursor:pointer}
.multi-check input{width:auto}
.calc-box{padding:12px;border-radius:8px;margin-top:12px;font-weight:600;text-align:center;font-size:13px;line-height:1.5}
.calc-ok{background:#e8f5e9;color:#2e7d32}
.calc-warn{background:#fff3e0;color:#e65100}
.calc-err{background:#ffebee;color:#c62828}
.section-label{font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 10px;padding-bottom:4px;border-bottom:2px solid var(--green)}
.req-star{color:#d32f2f;font-weight:700}
.field-error{border-color:#d32f2f !important;box-shadow:0 0 0 3px rgba(211,47,47,.15) !important}
.report-summary{display:flex;justify-content:space-around;flex-wrap:wrap;gap:12px;text-align:center}
.report-summary .num{font-size:24px;font-weight:700;color:var(--green)}
.report-summary .lbl{font-size:12px;color:var(--muted)}
.planned-inputs-box{background:#f9f9f9;padding:12px;border-radius:8px}
.planned-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;background:#fff;padding:8px;border-radius:6px}
.planned-row > div{display:flex;flex-direction:column}
.planned-row label{font-size:11px;color:var(--muted);margin-bottom:2px}
.planned-row input,.planned-row select{font-size:13px}
.voided{opacity:.5;text-decoration:line-through}
.slider-wrap{display:flex;align-items:center;gap:12px}
.slider-wrap input[type=range]{flex:1;padding:0;height:6px}
.slider-pct{min-width:50px;text-align:right;font-weight:700;color:var(--green)}
.dt-row{display:flex;gap:8px}
.dt-row > div{flex:1}
.form-actions{display:flex;gap:8px;margin-top:8px}
.form-actions .btn{flex:1}
.perm-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee}
.perm-row:last-child{border:none}
.perm-select{width:auto;padding:4px 8px;font-size:13px}
</style>
</head>
<body>

<div id="configScreen" style="display:none">
<div class="login-box">
<h1>🔧 Supabase Setup</h1>
<p>Enter your Supabase project credentials</p>
<div class="form-group"><label>Project URL</label><input id="sbUrl" placeholder="https://xxxx.supabase.co"></div>
<div class="form-group"><label>Anon Key</label><input id="sbKey" placeholder="eyJhbGciOi..." type="password"></div>
<button class="btn btn-primary" style="width:100%" onclick="saveConfig()">Save & Continue</button>
</div>
</div>

<div id="loginScreen" style="display:none">
<div class="login-box">
<h1>🌾 SANTAGRO</h1>
<p>Farm Management System</p>
<div class="form-group"><label>Username</label><input id="loginUser" placeholder="Enter username"></div>
<div class="form-group"><label>Password</label><input id="loginPass" type="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()"></div>
<button class="btn btn-primary" style="width:100%" onclick="doLogin()">Login</button>
<div id="qrSection" style="margin-top:20px;text-align:center;border-top:1px solid #eee;padding-top:16px">
  <p style="font-size:12px;color:#999;margin-bottom:8px">📱 Scan to open on mobile</p>
  <div id="loginQR"></div>
</div>
</div>
</div>

<div id="mainApp" style="display:none">
<div id="header">
<h2 id="headerTitle">🌾 SANTAGRO FARM</h2>
<div class="user-area">
<span class="user-name" id="userName"></span>
<button class="logout-btn" onclick="showChangePassword()" style="margin-right:6px">🔑 Password</button>
<button class="logout-btn" onclick="logout()">Logout</button>
</div>
</div>
<div id="content"></div>
</div>

// ============================================================
// 日期格式转换
// ============================================================
function isoToDDMMYYYY(iso) {
  if (!iso) return '';
  const s = String(iso).substring(0,10);
  const parts = s.split('-');
  if (parts.length !== 3) return s;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

function ddmmyyyyToISO(ddmmyyyy) {
  if (!ddmmyyyy) return null;
  const parts = String(ddmmyyyy).split('/');
  if (parts.length !== 3) return null;
  const dd = parts[0].padStart(2,'0');
  const mm = parts[1].padStart(2,'0');
  const yyyy = parts[2];
  if (yyyy.length !== 4) return null;
  return `${yyyy}-${mm}-${dd}`;
}

function parseAnyDate(str) {
  if (!str) return null;
  str = String(str).trim();
  if (!str) return null;
  let m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) {
    const dd = parseInt(m[1]), mm = parseInt(m[2]), yyyy = m[3];
    if (dd > 12) return `${yyyy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    if (mm > 12) return `${yyyy}-${String(dd).padStart(2,'0')}-${String(mm).padStart(2,'0')}`;
    return `${yyyy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
  }
  m = str.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  const d = new Date(str);
  if (!isNaN(d.getTime())) {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return `${yyyy}-${mm}-${dd}`;
  }
  return null;
}

function parseAnyBool(str) {
  if (str === null || str === undefined) return null;
  const s = String(str).trim().toLowerCase();
  if (['true','1','yes','y','t'].includes(s)) return 'true';
  if (['false','0','no','n','f',''].includes(s)) return 'false';
  return null;
}

function todayDDMMYYYY() {
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

function nowHHMM() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${hh}:${mm}`;
}

function splitDatetime(iso) {
  if (!iso) return { date: '', time: '' };
  const d = new Date(iso);
  if (isNaN(d.getTime())) return { date: '', time: '' };
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return { date: `${dd}/${mm}/${yyyy}`, time: `${hh}:${mi}` };
}

function mergeDatetime(dateStr, timeStr) {
  if (!dateStr) return null;
  const parts = String(dateStr).split('/');
  if (parts.length !== 3) return null;
  const [dd, mm, yyyy] = parts;
  const [hh, mi] = (timeStr || '00:00').split(':');
  const d = new Date(`${yyyy}-${mm}-${dd}T${hh.padStart(2,'0')}:${(mi||'00').padStart(2,'0')}:00`);
  if (isNaN(d.getTime())) return null;
  return d.toISOString();
}

// ============================================================
// 权限判断（三态：None / View / Edit）
// ============================================================
function canView(key) {
  if (!currentUser) return false;
  if (currentUser.role === 'admin') return true;
  if (!currentUser.allowed_tables) return false;
  return currentUser.allowed_tables.includes(key);
}

function canEdit(key) {
  if (!currentUser) return false;
  if (currentUser.role === 'admin') return true;
  if (!currentUser.editable_tables) return false;
  return currentUser.editable_tables.includes(key);
}

// 兼容旧代码
function hasAccess(key) {
  return canView(key);
}

// ============================================================
// INIT
// ============================================================
function init() {
  const url = EMBEDDED_URL || localStorage.getItem('sb_url');
  const key = EMBEDDED_KEY || localStorage.getItem('sb_key');
  if (url && key) {
    sb = supabase.createClient(url, key);
    showLogin();
  } else {
    document.getElementById('configScreen').style.display = 'flex';
  }
}

function saveConfig() {
  const url = document.getElementById('sbUrl').value.trim();
  const key = document.getElementById('sbKey').value.trim();
  if (!url || !key) { toast('Please fill in both fields'); return; }
  localStorage.setItem('sb_url', url);
  localStorage.setItem('sb_key', key);
  sb = supabase.createClient(url, key);
  document.getElementById('configScreen').style.display = 'none';
  showLogin();
}

function showLogin() {
  document.getElementById('configScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  const params = new URLSearchParams(window.location.search);
  const preUser = params.get('u');
  document.getElementById('loginUser').value = preUser || '';
  document.getElementById('loginPass').value = '';
  const baseUrl = window.location.href.split('?')[0];
  const qrDiv = document.getElementById('loginQR');
  if (qrDiv) {
    qrDiv.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=2&data=${encodeURIComponent(baseUrl)}" style="width:160px;height:160px;border-radius:8px" alt="QR Code" onerror="this.style.display='none'">`;
  }
}

async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  if (!u || !p) { toast('Enter username and password'); return; }
  const hash = await sha256(p);
  const { data, error } = await sb.from('app_users')
    .select('*')
    .eq('username', u)
    .eq('password_hash', hash)
    .single();
  if (error || !data) { toast('Invalid credentials'); return; }
  currentUser = data;
  localStorage.setItem('session', JSON.stringify({
    id: data.id,
    username: data.username,
    role: data.role,
    displayName: data.display_name,
    allowed_tables: data.allowed_tables,
    editable_tables: data.editable_tables
  }));
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('userName').textContent = data.display_name || data.username;
  showDashboard();
}

function logout() {
  localStorage.removeItem('session');
  currentUser = null;

async function changePassword() {
  const oldPwd = document.getElementById('pwd_old').value;
  const newPwd = document.getElementById('pwd_new').value;
  const confirmPwd = document.getElementById('pwd_confirm').value;
  const errEl = document.getElementById('pwd_err');
  errEl.style.display = 'none';

  if (!oldPwd || !newPwd || !confirmPwd) {
    errEl.textContent = 'Please fill in all fields';
    errEl.style.display = 'block';
    return;
  }
  if (newPwd.length < 6) {
    errEl.textContent = 'New password must be at least 6 characters';
    errEl.style.display = 'block';
    return;
  }
  if (newPwd !== confirmPwd) {
    errEl.textContent = 'New password and confirm do not match';
    errEl.style.display = 'block';
    return;
  }
  if (newPwd === oldPwd) {
    errEl.textContent = 'New password must be different from old password';
    errEl.style.display = 'block';
    return;
  }

  const oldHash = await sha256(oldPwd);
  const { data: user, error: queryErr } = await sb.from('app_users')
    .select('id')
    .eq('id', currentUser.id)
    .eq('password_hash', oldHash)
    .single();

  if (queryErr || !user) {
    errEl.textContent = 'Old password is incorrect';
    errEl.style.display = 'block';
    return;
  }

  const newHash = await sha256(newPwd);
  const { error } = await sb.from('app_users')
    .update({ password_hash: newHash })
    .eq('id', currentUser.id);

  if (error) {
    errEl.textContent = 'Error: ' + error.message;
    errEl.style.display = 'block';
    return;
  }

  document.getElementById('pwdModal').remove();
  toast('Password changed. Please login again.', 5000);

  setTimeout(() => { logout(); }, 2000);
}

async function sha256(msg) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function toast(msg, ms=3000) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), ms);
}

async function exportCSV(key) {
  const cfg = TABLES[key];
  for (const f of cfg.fields) {
    if (f.type === 'link' || f.type === 'multilink') {
      await loadLinkCacheForField(f);
    }
  }
  const { data, error } = await sb.from(key).select('*').order('created_at', {ascending: false});
  if (error) { toast('Error: ' + error.message); return; }
  if (!data || data.length === 0) { toast('No data to export'); return; }
  const headers = ['ID', ...cfg.fields.map(f => f.label), 'Created At'];
  const rows = [headers];
  for (const row of data) {
    const values = [row.id];
    for (const f of cfg.fields) {
      let val = row[f.col];
      if (val === null || val === undefined) {
        val = '';
      } else if (f.type === 'link') {
        val = linkCache[`${f.table}_${val}`]?.[f.showField] || val;
      } else if (f.type === 'multilink') {
        val = Array.isArray(val) ? val.map(id => linkCache[`${f.table}_${id}`]?.[f.showField] || id).join('; ') : val;
      } else if (f.type === 'multiselect' && Array.isArray(val)) {
        val = val.join('; ');
      } else if (f.type === 'datetime') {
        val = new Date(val).toLocaleString();
      } else if (f.type === 'date') {
        val = isoToDDMMYYYY(val);
      }
      values.push(String(val));
    }
    values.push(row.created_at ? new Date(row.created_at).toLocaleString() : '');
    rows.push(values);
  }
  const csv = rows.map(r => r.map(cell => {
    const escaped = String(cell).replace(/"/g, '""');
    return `"${escaped}"`;
  }).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${key}_export_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(`Exported ${data.length} records`);
}

// ============================================================
// CSV IMPORT
// ============================================================
function importCSV(key) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.csv';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    await processCSVImport(key, text);
  };
  input.click();
}

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { cell += '"'; i++; }
        else inQuotes = false;
      } else cell += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (cell !== '' || row.length > 0) { row.push(cell); rows.push(row); row = []; cell = ''; }
        if (c === '\r' && text[i+1] === '\n') i++;
      } else cell += c;
    }
  }
  if (cell !== '' || row.length > 0) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ''));
}

async function processCSVImport(key, text) {
  const cfg = TABLES[key];
  const rows = parseCSV(text);
  if (rows.length < 2) { toast('CSV must have header and at least one data row'); return; }
  const headers = rows[0].map(h => h.trim().toLowerCase());
  const dataRows = rows.slice(1);
  for (const f of cfg.fields) {
    if (f.type === 'link') await loadLinkCache(f.table, f.showField);
    if (f.type === 'lookup') await loadLookupCache(f.lookupCategory);
  }
  const successList = [];
  const failList = [];
  for (let i = 0; i < dataRows.length; i++) {
    const row = dataRows[i];
    try {
      const record = {};
      for (const f of cfg.fields) {
        if (f.previewOnly) continue;
        const idx = headers.findIndex(h => h === f.label.toLowerCase());
        if (idx === -1) continue;
        let val = (row[idx] || '').trim();
        if (val === '' && f.type !== 'date') continue;
        if (f.type === 'number' || f.type === 'range') {
          val = val === '' ? null : parseFloat(val);
          if (val !== null && isNaN(val)) throw new Error(`Invalid number for ${f.label}: "${row[idx]}"`);
        } else if (f.type === 'date') {
          val = val ? parseAnyDate(val) : null;
          if (val === null && row[idx]) throw new Error(`Invalid date for ${f.label}: "${row[idx]}"`);
        } else if (f.type === 'datetime') {
          val = val ? parseAnyDate(val.substring(0,10)) : null;
          if (val === null && row[idx]) throw new Error(`Invalid datetime for ${f.label}: "${row[idx]}"`);
          if (val) val = val + 'T00:00:00Z';
        } else if (f.type === 'link') {
          const items = Object.values(linkCache).filter(v => typeof v === 'object' && v.id && String(v[f.showField]).toLowerCase() === val.toLowerCase());
          if (items.length === 0) throw new Error(`Cannot find ${f.label}: "${val}"`);
          val = items[0].id;
        } else if (f.type === 'select' && f.opts) {
          const found = f.opts.find(o => o.toLowerCase() === val.toLowerCase());
          if (found) val = found;
        }
        record[f.col] = val;
      }
      for (const f of cfg.fields) {
        if (f.previewOnly || !f.required) continue;
        const v = record[f.col];
        if (v === null || v === undefined || v === '') {
          throw new Error(`Missing required field: ${f.label}`);
        }
      }
      successList.push(record);
    } catch (e) {
      failList.push({ row: i + 2, error: e.message });
    }
  }
  if (successList.length > 0) {
    const { error } = await sb.from(key).insert(successList);
    if (error) {
      toast('Batch insert failed: ' + error.message);
      console.error('Insert error:', error);
      return;
    }
  }
  let msg = `Imported ${successList.length}`;
  if (failList.length > 0) {
    msg += `, failed ${failList.length} (rows: ${failList.map(f => f.row).join(',')})`;
    console.warn('Import failures:', failList);
  }
  toast(msg, 5000);
  openModule(key);
}

// ============================================================
// LINK CACHE
// ============================================================
async function loadLinkCache(tableName, showField, extraFields) {
  const cacheKey = tableName + '_' + showField;
  if (linkCache[cacheKey + '_loaded']) return;
  const cols = ['id', showField, ...(extraFields || [])].join(',');
  const { data } = await sb.from(tableName).select(cols);
  if (data) {
    for (const row of data) {
      linkCache[`${tableName}_${row.id}`] = row;
    }
    linkCache[cacheKey + '_loaded'] = true;
  }
}

async function loadLinkCacheForField(f) {
  if (f.table === 'inputs_inventory' || f.table === 'parts_inventory') {
    await loadLinkCache(f.table, f.showField, ['unit', 'avg_unit_price', 'current_stock', 'abc_class', 'warehouse_zone', 'bin_location']);
  } else if (f.table === 'equipment') {
    await loadLinkCache('equipment', f.showField, ['tank_capacity']);
  } else {
    await loadLinkCache(f.table, f.showField);
  }
}

// ============================================================
// LOOKUP CACHE
// ============================================================
function normalizeLookupKey(v) {
  return String(v || '').toLowerCase().replace(/[\s\(\)（）]/g, '').replace(/(h|km|kg|l|t)$/i, '');
}

async function loadLookupCache(category) {
  if (!category) return;
  if (lookupCache[category + '_loaded']) return;
  const { data } = await sb.from('lookup_values').select('*').eq('category', category).eq('active', 'true');
  if (data) {
    const seen = new Set();
    const unique = [];
    for (const item of data) {
      if (!item.value) continue;
      const key = normalizeLookupKey(item.value);
      if (seen.has(key)) continue;
      seen.add(key);
      unique.push(item);
    }
    lookupCache[category] = unique;
    lookupCache[category + '_loaded'] = true;
  }
}

function getLookupOptions(category) {
  const items = lookupCache[category] || [];
  return items.map(i => ({value: i.value, label: i.label || i.value}));
}

// ============================================================
// 自动编号
// ============================================================
async function generateNextDocNumber(cfg, tableName) {
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  const datePart = `${yyyy}${mm}${dd}`;
  const prefix = `${cfg.prefix}${datePart}-`;
  const { data } = await sb.from(tableName)
    .select(cfg.field)
    .like(cfg.field, prefix + '%')
    .order(cfg.field, { ascending: false })
    .limit(1);
  let nextSeq = 1;
  if (data && data.length > 0 && data[0][cfg.field]) {
    const parts = String(data[0][cfg.field]).split('-');
    const lastSeq = parseInt(parts[parts.length - 1], 10);
    if (!isNaN(lastSeq)) nextSeq = lastSeq + 1;
  }
  return prefix + String(nextSeq).padStart(cfg.digits, '0');
}

async function previewNewAvgPrice(tableName, inputId, intakeQty, unitPrice) {
  const { data: item } = await sb.from(tableName)
    .select('current_stock, avg_unit_price').eq('id', inputId).single();
  const oldStock = Number(item?.current_stock) || 0;
  const oldAvg = Number(item?.avg_unit_price) || 0;
  const newStock = oldStock + Number(intakeQty);
  const newAvg = newStock > 0
    ? ((oldStock * oldAvg) + (Number(intakeQty) * Number(unitPrice))) / newStock
    : 0;
  const deviation = oldAvg > 0 ? ((newAvg - oldAvg) / oldAvg) * 100 : 0;
  return { oldStock, oldAvg, newStock, newAvg, deviation };
}

          <button class="btn btn-primary" style="flex:1" id="appr_ok">Approve & Save</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);

// ============================================================
// Maintenance Logs 停机时间自动计算
// ============================================================
function recalcDowntime() {
  const startDate = document.getElementById('fld_maintenance_date')?.value;
  const endDate = document.getElementById('fld_completion_date')?.value;
  const el = document.getElementById('fld_downtime_hours');
  if (!el) return;
  if (!startDate || !endDate) { el.value = ''; return; }
  const startISO = ddmmyyyyToISO(startDate);
  const endISO = ddmmyyyyToISO(endDate);
  if (!startISO || !endISO) { el.value = ''; return; }
  const startD = new Date(startISO);
  const endD = new Date(endISO);
  const days = (endD - startD) / (1000 * 60 * 60 * 24);
  if (days < 0) { el.value = '0'; return; }
  const hours = days === 0 ? 8 : days * 24;
  el.value = hours.toFixed(1);
}

async function showForm(key, editId) {

    else if (f.recalc === 'intake') recalcAttr = 'oninput="recalcIntakePreview()"';
    else if (f.recalc === 'exitCost') recalcAttr = 'oninput="recalcExitCost()"';

    } else if (f.type === 'textarea') {

    } else if (f.type === 'number') {
      fieldsHtml += `<input id="${id}" type="number" step="any" value="${val}" placeholder="0" ${readonlyAttr} ${onchangeAttr} ${recalcAttr}>`;
    } else if (f.type === 'range') {

      }

    } else if (f.type === 'lookup') {

      for (const opt of opts) {
        fieldsHtml += `<option value="${escapeHtml(opt.value)}" ${val === opt.value ? 'selected' : ''}>${escapeHtml(opt.label)}</option>`;
      }
      fieldsHtml += `</select>`;
    } else if (f.type === 'multiselect') {

      for (const opt of f.opts) {

      }
      fieldsHtml += `</div>`;
    } else if (f.type === 'multilink') {
      const selected = Array.isArray(val) ? val.map(String) : [];
      const linkItems = Object.entries(linkCache)
        .filter(([k,v]) => k.startsWith(f.table + '_') && typeof v === 'object' && v.id)

        fieldsHtml += `<label><input type="checkbox" value="${item.id}" ${selected.includes(String(item.id)) ? 'checked' : ''} ${readonlyAttr}> ${escapeHtml(String(item[f.showField]))}</label>`;
      }
      fieldsHtml += `</div>`;
    } else if (f.type === 'link') {
      const linkItems = Object.entries(linkCache)
        .filter(([k,v]) => k.startsWith(f.table + '_') && typeof v === 'object' && v.id)
        .map(([k,v]) => v);
      const isSearchable = SEARCHABLE_LINK_TABLES.includes(f.table) && linkItems.length > 15;

      fieldsHtml += `<select id="${id}" ${onchangeAttr} ${readonlyAttr} ${isSearchable && !f.readonly ? 'data-searchable="1"' : ''}><option value="">Select...</option>`;
      for (const item of linkItems) {

    } else if (f.type === 'linkedreadonly') {

  }

  let extraSectionHtml = '';
  if (cfg.hasPlannedInputs) {
    extraSectionHtml += `
      <div class="section-label">Planned Inputs</div>
      <div class="planned-inputs-box" id="plannedInputsBox">

        <button type="button" class="btn btn-outline btn-sm" style="width:100%;margin-top:8px" onclick="addPlannedInputRow()">+ Add Planned Input</button>

      <div class="planned-inputs-box" id="partsUsedBox">
        <div id="partsUsedRows"></div>

          <div class="inv-row"><span class="label">Parts Cost</span><span class="value" id="partsCostDisplay">0.00</span></div>
        </div>
      </div>
    `;
  }

  content.innerHTML = `<div class="section-header">
    <button class="back-btn" onclick="openModule('${key}')">← Back</button>
    <h3>${isEdit ? 'Edit' : 'Add'} ${cfg.label}</h3>
  </div>
  <div class="form-container">
    <div class="card">
      ${fieldsHtml}
      ${extraSectionHtml}
      <div class="form-actions">
        <button class="btn btn-primary" onclick="saveRecord('${key}', ${isEdit ? editId : 'null'})">
          ${isEdit ? 'Update' : 'Save'} Record
        </button>
        <button class="btn btn-outline" onclick="clearForm('${key}')">Clear Form</button>
      </div>
    </div>
  </div>`;

  searchableIds.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      try {
        const ts = new TomSelect(el, {
          placeholder: 'Type to search...',
          allowEmptyOption: true,
          maxOptions: 500,
          sortField: { field: 'text', direction: 'asc' }
        });
        tomSelectInstances.push(ts);
      } catch(e) { console.warn('TomSelect init failed for', id, e); }
    }
  });

  if (cfg.autoNumber && !isEdit) {
    const nextNum = await generateNextDocNumber(cfg.autoNumber, key);
    const el = document.getElementById('fld_' + cfg.autoNumber.field);

  if (cfg.hasPlannedInputs && isEdit) {

      .select('*').eq('work_order_id', editId);
    for (const p of (planned || [])) {

  }

  if (key === 'fuel_output' && isEdit) recalcFuelOutput();
  if (key === 'work_order_execution') {
    recalcWorkOrderExecution();
    if (isEdit) await autoFillFromWorkOrder();
    ['fuel_before_pct', 'fuel_after_pct'].forEach(col => {
      const el = document.getElementById('fld_' + col);

  if (key === 'inputs_intake') {
    const sel = document.getElementById('fld_input_id');
    if (sel && sel.value) await autoFillIntakePreview();
  }
  if (key === 'inputs_output') {

  if (key === 'fuel_intake') await autoFillFuelIntakePreview();
  if (key === 'fuel_output') await autoFillFuelOutputPrice();

// ============================================================
// CLEAR FORM
// ============================================================
async function clearForm(key) {
  const ok = confirm('Clear this form? All unsaved changes will be lost.');
  if (!ok) return;
  const cfg = TABLES[key];
  const today = todayDDMMYYYY();
  const now = nowHHMM();
  for (const f of cfg.fields) {
    if (f.previewOnly) continue;
    const el = document.getElementById('fld_' + f.col);
    if (!el) continue;
    if (f.type === 'multilink' || f.type === 'multiselect') {
      el.querySelectorAll('input:checked').forEach(c => { c.checked = false; });
    } else if (f.type === 'range') {
      el.value = 0;
      const pctEl = document.getElementById('fld_' + f.col + '_pct');
      if (pctEl) pctEl.textContent = '0%';
    } else if (f.type === 'datetime') {
      const dateEl = document.getElementById('fld_' + f.col + '__date');
      const timeEl = document.getElementById('fld_' + f.col + '__time');
      if (dateEl) dateEl.value = today;
      if (timeEl) timeEl.value = now;
    } else if (f.type === 'date') {
      el.value = today;
    } else if (f.type === 'link' || f.type === 'lookup') {
      if (el.tomselect) el.tomselect.clear();
      else el.value = '';
    } else if (f.type === 'linkedreadonly') {
      el.value = '';
    } else {
      el.value = '';
    }
  }
  if (cfg.autoNumber) {
    const numEl = document.getElementById('fld_' + cfg.autoNumber.field);
    if (numEl) {
      const nextNum = await generateNextDocNumber(cfg.autoNumber, key);
      numEl.value = nextNum;
    }
  }
  if (cfg.hasPartsUsed) {
    document.getElementById('partsUsedRows').innerHTML = '';
    recalcPartsCost();
  }
  if (cfg.hasPlannedInputs) {
    document.getElementById('plannedInputsRows').innerHTML = '';
  }
  if (key === 'fuel_intake') await autoFillFuelIntakePreview();
  if (key === 'fuel_output') await autoFillFuelOutputPrice();
  if (key === 'inputs_intake') await autoFillIntakePreview();
  if (key === 'inputs_output') await autoFillInputUnit();
  if (key === 'work_order_execution') recalcWorkOrderExecution();
  if (key === 'maintenance_logs') recalcDowntime();
  if (key === 'parts_intake') await autoFillPartsIntakePreview();
  if (key === 'parts_output' || key === 'parts_movements') await autoFillPartsOutput();
  toast('Form cleared');
}

    <div style="flex:1">
      <label>Qty</label>
      <input type="number" step="any" class="planned-qty" value="${data ? (data.quantity_used ?? '') : ''}" placeholder="0" oninput="recalcPartsCost()">
    </div>
    <div style="flex:0 0 90px">
      <label>Total</label>
      <input type="text" class="planned-total" value="0.00" readonly>
    </div>
    <div style="flex:0 0 auto;padding-bottom:4px">
      <button type="button" class="btn btn-danger btn-sm" onclick="document.getElementById('${rowId}').remove();recalcPartsCost();">✕</button>
    </div>
  `;
  rows.appendChild(div);
  onPartsUsedChange(rowId);
}

function onPartsUsedChange(rowId) {
  const row = document.getElementById(rowId);
  if (!row) return;
  const sel = row.querySelector('.planned-input-select');
  const unitEl = row.querySelector('.planned-unit');
  const priceEl = row.querySelector('.planned-price');
  const opt = sel.options[sel.selectedIndex];
  const unitVal = opt?.getAttribute('data-unit') || '';
  const priceVal = opt?.getAttribute('data-price') || '0';
  let unitLabel = unitVal;
  if (unitVal) {
    const found = getLookupOptions('unit').find(o => o.value === unitVal);
    if (found) unitLabel = found.label;
  }
  unitEl.value = unitLabel;
  priceEl.value = Number(priceVal).toFixed(2);
  recalcPartsCost();
}

function recalcPartsCost() {
  const rows = document.querySelectorAll('#partsUsedRows .planned-row');
  let total = 0;
  rows.forEach(r => {
    const price = parseFloat(r.querySelector('.planned-price')?.value) || 0;
    const qty = parseFloat(r.querySelector('.planned-qty')?.value) || 0;
    const rowTotal = price * qty;
    const totEl = r.querySelector('.planned-total');
    if (totEl) totEl.value = rowTotal.toFixed(2);
    total += rowTotal;
  });
  const display = document.getElementById('partsCostDisplay');
  if (display) display.textContent = total.toFixed(2);
  const laborEl = document.getElementById('fld_labor_cost');
  const costEl = document.getElementById('fld_cost');
  if (laborEl && costEl) {
    const labor = parseFloat(laborEl.value) || 0;
    costEl.value = (labor + total).toFixed(2);
  }
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ============================================================
// USER MANAGEMENT (三态权限 + 三态下拉)
// ============================================================
async function showUserManagement() {
  const content = document.getElementById('content');
  const { data, error } = await sb.from('app_users').select('*').order('id');
  if (error) { toast('Error: ' + error.message); return; }

  let html = `<div class="section-header">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <h3>User Management</h3>
    <button class="btn btn-primary btn-sm" onclick="showUserForm()">+ Add User</button>
  </div><div class="list-container">`;

  for (const u of (data || [])) {
    const viewCount = u.role === 'admin' ? 'All' : (u.allowed_tables ? u.allowed_tables.length : 0) + ' visible';
    const editCount = u.role === 'admin' ? 'All' : (u.editable_tables ? u.editable_tables.length : 0) + ' editable';
    html += `<div class="list-item">
      <div class="info">
        <div class="main">${u.display_name || u.username}</div>
        <div class="sub">@${u.username} · ${u.role} · ${viewCount}, ${editCount}</div>
      </div>
      <div class="actions">
        <button onclick="showUserQR('${u.username}','${u.display_name || u.username}')" title="QR Code">📱</button>
        <button onclick="showUserForm(${u.id})" title="Edit">✏️</button>
        ${u.username !== 'admin' ? `<button onclick="deleteUser(${u.id})" title="Delete">🗑️</button>` : ''}
      </div>
    </div>`;
  }
  html += `</div>`;

  content.innerHTML = html;
}

function showUserQR(username, displayName) {
  const baseUrl = window.location.href.split('?')[0].split('#')[0];
  const loginUrl = baseUrl + '?u=' + encodeURIComponent(username);
  const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=2&data=${encodeURIComponent(loginUrl)}`;

  const old = document.getElementById('qrModal');
  if (old) old.remove();

  const modal = document.createElement('div');
  modal.id = 'qrModal';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';
  modal.onclick = function(e) { if (e.target === modal) modal.remove(); };
  modal.innerHTML = `
    <div style="background:#fff;border-radius:16px;padding:28px;text-align:center;max-width:340px;width:100%">
      <h3 style="color:#1a5632;margin-bottom:4px">📱 ${escapeHtml(displayName)}</h3>
      <p style="color:#666;font-size:13px;margin-bottom:16px">Scan with phone camera to login</p>
      <img src="${qrSrc}" style="width:240px;height:240px;border-radius:8px" alt="QR" onerror="this.style.display='none'">
      <p style="font-size:11px;color:#999;margin-top:8px">Username: <strong>${escapeHtml(username)}</strong></p>
      <p style="font-size:11px;color:#999">They just need to enter their password</p>
      <button class="btn btn-outline" style="width:100%;margin-top:16px" onclick="document.getElementById('qrModal').remove()">Close</button>
    </div>`;
  document.body.appendChild(modal);
}

async function showUserForm(editId) {
  const content = document.getElementById('content');
  let user = {};
  if (editId) {
    const { data } = await sb.from('app_users').select('*').eq('id', editId).single();
    user = data || {};
  }

  const permTables = Object.entries(TABLES).filter(([k,v]) => !v.isAdmin);
  const userView = user.allowed_tables || [];
  const userEdit = user.editable_tables || [];

  let permHtml = '';
  for (const [k,v] of permTables) {
    const isEdit = userEdit.includes(k);
    const isView = userView.includes(k);
    const state = isEdit ? 'edit' : (isView ? 'view' : 'none');
    permHtml += `<div class="perm-row">
      <span style="font-size:13px">${v.icon} ${v.label}</span>
      <select class="perm-select" data-table="${k}">
        <option value="none" ${state==='none'?'selected':''}>None</option>
        <option value="view" ${state==='view'?'selected':''}>View only</option>
        <option value="edit" ${state==='edit'?'selected':''}>View + Edit</option>
      </select>
    </div>`;
  }

  content.innerHTML = `<div class="section-header">
    <button class="back-btn" onclick="showUserManagement()">← Back</button>
    <h3>${editId ? 'Edit' : 'Add'} User</h3>
  </div>
  <div class="form-container"><div class="card">
    <div class="form-group"><label>Username</label><input id="usr_username" value="${user.username || ''}" placeholder="username"></div>
    <div class="form-group"><label>Display Name</label><input id="usr_displayname" value="${user.display_name || ''}" placeholder="Display name"></div>
    <div class="form-group"><label>${editId ? 'New Password (leave blank to keep)' : 'Password'}</label><input id="usr_password" type="password" placeholder="password"></div>
    <div class="form-group"><label>Role</label><select id="usr_role">
      <option value="staff" ${user.role === 'staff' ? 'selected' : ''}>Staff</option>
      <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>Admin (all access)</option>
    </select></div>
    <div class="form-group" id="permGroup">
      <label>Table Permissions</label>
      ${permHtml}
      <p style="font-size:11px;color:#999;margin-top:8px">Note: permissions take effect after user logs in again.</p>
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="saveUser(${editId || 'null'})">${editId ? 'Update' : 'Create'} User</button>
  </div></div>`;
}

async function saveUser(editId) {
  const username = document.getElementById('usr_username').value.trim();
  const displayName = document.getElementById('usr_displayname').value.trim();
  const password = document.getElementById('usr_password').value;
  const role = document.getElementById('usr_role').value;

  if (!username) { toast('Username required'); return; }

  let allowedTables = [];
  let editableTables = [];
  if (role === 'admin') {
    allowedTables = Object.keys(TABLES).filter(k => !TABLES[k].isAdmin);
    editableTables = [...allowedTables];
  } else {
    const selects = document.querySelectorAll('.perm-select');
    for (const sel of selects) {
      const table = sel.dataset.table;
      if (sel.value === 'view') {
        allowedTables.push(table);
      } else if (sel.value === 'edit') {
        allowedTables.push(table);
        editableTables.push(table);
      }
    }
    if (allowedTables.length === 0) {
      toast('Select at least one table for staff users');
      return;
    }
  }

  const record = {
    username,
    display_name: displayName,
    role,
    allowed_tables: allowedTables,
    editable_tables: editableTables
  };

  if (password) {
    record.password_hash = await sha256(password);
  } else if (!editId) {
    toast('Password required for new user');
    return;
  }

  if (editId) {
    const { error } = await sb.from('app_users').update(record).eq('id', editId);
    if (error) { toast('Error: ' + error.message); return; }
    toast('User updated');
  } else {
    const { error } = await sb.from('app_users').insert(record);
    if (error) { toast('Error: ' + error.message); return; }
    toast('User created');
  }
  showUserManagement();
}

async function deleteUser(id) {
  if (!confirm('Delete this user?')) return;
  const { error } = await sb.from('app_users').delete().eq('id', id);
  if (error) { toast('Error: ' + error.message); return; }
  toast('User deleted');
  showUserManagement();
}

const savedSession = localStorage.getItem('session');
if (savedSession) {
  const url = EMBEDDED_URL || localStorage.getItem('sb_url');
  const key = EMBEDDED_KEY || localStorage.getItem('sb_key');
  if (url && key) {
    sb = supabase.createClient(url, key);
    currentUser = JSON.parse(savedSession);
  }
}

init();

if (currentUser) {
  document.getElementById('loginScreen') && (document.getElementById('loginScreen').style.display = 'none');
  document.getElementById('configScreen') && (document.getElementById('configScreen').style.display = 'none');
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('userName').textContent = currentUser.displayName || currentUser.username;
  showDashboard();
}
